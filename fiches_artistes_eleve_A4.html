<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches artistes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16324f; --muted:#4b6480; --line:rgba(29,78,137,.16); --accent:#1d4e89;
    --paper:#ffffff; --chip:#f3f8ff; --sun:#ffb703; --teal:#0d9488;
  }
  *{box-sizing:border-box; max-width:100%}
  html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Nunito",system-ui,Segoe UI,Roboto,Arial}
  body{
    background:
      radial-gradient(900px 420px at 8% -10%, #ffe8a3 0%, transparent 55%),
      radial-gradient(700px 380px at 100% 0%, #cdefff 0%, transparent 50%),
      linear-gradient(180deg, #f7fbff 0%, #eef6ff 100%);
  }
  header.app-header{
    position:sticky;top:0;z-index:10;padding:1rem 1.1rem;
    background:rgba(255,255,255,.9);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:.85rem;max-width:1240px;margin:0 auto;}
  .brand-mark{
    width:3.2rem;height:3.2rem;border-radius:18px;display:grid;place-items:center;
    color:#fff;font-size:1.7rem;font-weight:900;
    background:linear-gradient(135deg, var(--accent), #38bdf8);
    box-shadow:0 10px 24px rgba(29,78,137,.28);
  }
  h1{margin:0;font-size:clamp(1.5rem,1.4vw + 1rem,2.2rem);font-weight:900;color:var(--ink)}
  .wrap{max-width:1240px;margin:0 auto;padding:1rem 1.1rem 2.4rem;display:grid;gap:12px}
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:end;
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);border-radius:22px;padding:1rem 1.15rem;
    box-shadow:0 14px 32px rgba(22,50,79,.08);
  }
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  input,select,button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;font:inherit;font-weight:800;color:var(--ink)}
  input[type="file"]{padding:6px 10px;border-radius:14px}
  button{cursor:pointer}
  button.primary{background:var(--sun);color:#16324f;border-color:transparent;box-shadow:0 6px 0 #e09a00}
  #btnPrint,#btnPDF{background:#fff;color:var(--accent)}
  .status{
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;
    padding:10px 14px;font-size:14px;font-weight:800;color:var(--muted);
    box-shadow:0 10px 24px rgba(22,50,79,.06);
  }

  .print-root{width:210mm;margin:0 auto}

  .page{
    width:210mm;height:297mm;background:#fff;
    margin:0 auto 16px;padding:10mm;display:grid;grid-template-rows:repeat(4,1fr);gap:5mm;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 18px 40px rgba(22,50,79,.1);
  }
  .card{
    border:1px solid var(--line);border-radius:10px;display:grid;
    grid-template-columns:1.2fr 0.8fr 0.32fr; /* texte / photo / QR */
    grid-template-rows:auto 1fr; 
    grid-template-areas:
      "meta  photo qr"
      "avis  photo qr";
    gap:6px;padding:6px;min-height:0;overflow:hidden;
    break-inside:avoid;page-break-inside:avoid;-webkit-region-break-inside:avoid;
    align-content:stretch;
  }

  .meta{grid-area:meta; display:grid;gap:2px;min-height:0}
  .title{
    font-weight:800;font-size:16px;line-height:1.2;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:2.4em;
    overflow-wrap:anywhere; word-break:break-word;
  }
  .row{
    display:flex;
    gap:6px;
    align-items:baseline;
    line-height:1.45; /* augmenté pour éviter toute coupure des jambages */
  }
  .lab{font-size:11px;color:#64748b;min-width:70px;flex:0 0 auto}
  .val{
    font-size:13px;
    line-height:1.35; /* plus haut qu’avant */
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .flag{font-size:24px; vertical-align:-3px; margin-right:6px}

  .photo{
    grid-area:photo;
    height:100%;
    display:flex;align-items:center;justify-content:center;background:var(--chip);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:120px;position:relative;
  }
  .photo img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    object-position:center center;
    background:#fff;
    display:block;
  }

  .qr{
    grid-area:qr;
    display:grid;grid-template-rows:auto auto 1fr;align-items:start;justify-items:center;
    border:1px solid var(--line);border-radius:8px;padding:4px
  }
  .qr .cap{font-size:11px;color:#64748b;margin-bottom:2px}
  .qrbox{width:60px;height:60px;display:grid;place-items:center;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:4px;overflow:hidden}
  .qrbox canvas,.qrbox img{width:100%;height:100%;object-fit:contain}
  .qrFallback{font-size:10px;color:#64748b;margin-top:2px;word-break:break-all;text-align:center}

  .avis{
    grid-area:avis;
    border:1px dashed #cbd5e1;border-radius:8px;padding:6px;
    min-height:0; height:100%;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;
  }
  .avis .hint{font-size:12px;color:#334155;font-weight:600;}

  @media print{
    @page{ size:A4; margin:10mm; }
    header,.app-header,.controls,.status{display:none!important}
    body{background:#fff;font-family:system-ui,Segoe UI,Roboto,Arial}
    .page{margin:0;padding:10mm;width:210mm;height:297mm;gap:5mm;border-radius:0;box-shadow:none}
    .card{border-width:0.6pt;padding:4mm 5mm;gap:3.5mm;grid-template-columns:1.2fr 0.8fr 0.28fr}
    .title{font-size:15px}
    .lab{font-size:10px}
    .val{font-size:12px; line-height:1.35;}
    .qrbox{width:58px;height:58px}
    .flag{font-size:20px; vertical-align:-3px}
  }
</style>
</head>

<header class="app-header">

function chunk(arr, size){ const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function formatJJMMAAAA(d){
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function out(dt){ return pad2(dt.getDate())+'-'+pad2(dt.getMonth()+1)+'-'+dt.getFullYear(); }
  if(d==null) return '';
  if(d instanceof Date && !isNaN(d)) return out(d);
  if(typeof d==='number' && isFinite(d)){ const whole=Math.floor(d); const epoch=Date.UTC(1899,11,30); const dt=new Date(epoch + whole*86400000); return isNaN(dt)? '': out(dt); }
  if(typeof d==='string'){
    const s=d.trim(); if(!s) return '';
    let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(m){ let dd=+m[1], mm=+m[2], yy=+m[3]; if(yy<100) yy+=2000; const dt=new Date(yy,mm-1,dd); return isNaN(dt)? '': out(dt); }
    m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
    if(m){ const yy=+m[1], mm=+m[2], dd=+m[3]; const dt=new Date(yy,mm-1,dd); return isNaN(dt)? '': out(dt); }
    m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2})$/);
    if(m){ const dd=+m[1], mm=+m[2], yy=2000+(+m[3]); const dt=new Date(yy,mm-1,dd); return isNaN(dt)? '': out(dt); }
    const t=Date.parse(s); return isNaN(t)? '': out(new Date(t));
  }
  return '';
}


  /* Drapeaux emoji étendus — résolution robuste des pays */
function normalizeCountryName(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[’'`]/g, "")
    .replace(/[-–—]/g, " ")
    .replace(/[().,]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function toFlagFromCode(code){
  if(!code || !/^[A-Z]{2}$/i.test(code)) return '';
  code = code.toUpperCase();
  if(code === 'UK') code = 'GB';
  let out = '';
  for(let i=0;i<2;i++) out += String.fromCodePoint(0x1F1E6 + (code.charCodeAt(i)-65));
  return out;
}

function flagForOrigin(origRaw){
  if(!origRaw) return '';
  const s = normalizeCountryName(origRaw);

  // Exact match first.
  if(ORIGIN_MAP[s]) return toFlagFromCode(ORIGIN_MAP[s]) + ' ';

  // ISO alpha-2 code.
  if(/^[a-z]{2}$/i.test(s)) return toFlagFromCode(s) + ' ';

  // Longest matching country name wins, preventing e.g. "congo" from
  // overriding "republique democratique du congo".
  const keys = Object.keys(ORIGIN_MAP)
    .filter(k => k.length > 2)
    .sort((a,b) => b.length - a.length);

  for(const k of keys){
    if(s === k || s.includes(k)){
      return toFlagFromCode(ORIGIN_MAP[k]) + ' ';
    }
  }
  return '';
}

function cleanHeader(s){
  return String(s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[’'`]/g,"")
    .replace(/[-–—]/g," ").replace(/[().,]/g," ")
    .replace(/\s+/g," ").trim();
}
function getField(row, aliases){
  const keys = Object.keys(row||{});
  const normalized = new Map(keys.map(k=>[cleanHeader(k),k]));
  for(const alias of aliases){
    const k=normalized.get(cleanHeader(alias));
    if(k!==undefined) return row[k] ?? "";
  }
  return "";
}
function ensureKeys(row){
  return {
    Titre: getField(row, ["Œuvre / morceau","Oeuvre / morceau","Œuvre/morceau","Titre","titre"]),
    Auteur: getField(row, ["Artiste / Compositeur","Artiste/Compositeur","Artiste","Compositeur","Auteur","auteur"]),
    Origine: getField(row, ["Pays","Origine","origine"]),
    Date: getField(row, ["Date","date"]),
    Annee: getField(row, ["Année","Annee","année de création","annee de creation"]),
    Genre: getField(row, ["Genre","genre"]),
    Instruments: getField(row, ["Instruments","instruments"]),
    YouTube: getField(row, ["Lien YouTube (vérifiée)","Lien YouTube (verifiee)","Lien YouTube","YouTube","youtube"]),
    Lang: getField(row, ["Lang","lang"]),
    Photo: getField(row, ["Photo","photo"])
  };
}

function stripKey(value){
  return normalizeKey(value).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

const KNOWN_ARTIST_PHOTOS = {
  "pomme": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Pomme%20Bourges%20Autoharpe.jpg",
  "indochine": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Indochine%202009.JPG",
  "téléphone": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Festival%20des%20Vieilles%20Charrues%202016%20-%20Les%20Insus%20-%20039.jpg",
  "telephone": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Festival%20des%20Vieilles%20Charrues%202016%20-%20Les%20Insus%20-%20039.jpg",
  "clou": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Clou%20Cigale%2018-11-2021.jpg",
  "hervé": "https://commons.wikimedia.org/wiki/Special:Redirect/file/P2N2023Herve_1.jpg",
  "herve": "https://commons.wikimedia.org/wiki/Special:Redirect/file/P2N2023Herve_1.jpg",
  "the hu": "https://commons.wikimedia.org/wiki/Special:Redirect/file/2019%20RiP%20The%20Hu%20-%20by%202eight%20-%20ZSC2060.jpg"
};

function artistKeys(author){
  const a = [normalizeKey(author), stripKey(author)].filter(Boolean);
  return [...new Set(a)];
}

function readStudentPhoto(author){
  for(const key of artistKeys(author)){
    if(KNOWN_ARTIST_PHOTOS[key]) return KNOWN_ARTIST_PHOTOS[key];
  }
  for(const key of artistKeys(author)){
    for(const prefix of ["UNIFIED_ARTIST_IMG_V2_","CALENDAR_ARTIST_IMG_V1_","AUTHOR_IMG_"]){
      try{
        const raw = localStorage.getItem(prefix + key);
        if(!raw) continue;
        const url = JSON.parse(raw)?.url;
        if(url) return url;
      }catch(e){}
    }
  }
  return "";
}

function writeStudentPhoto(author, url){
  if(!author || !url) return;
  for(const key of artistKeys(author)){
    try{ localStorage.setItem("UNIFIED_ARTIST_IMG_V2_" + key, JSON.stringify({url})); }catch(e){}
    try{ localStorage.setItem("CALENDAR_ARTIST_IMG_V1_" + key, JSON.stringify({url})); }catch(e){}
    try{ localStorage.setItem("AUTHOR_IMG_" + key, JSON.stringify({url, credit:"Source : Wikipedia/Wikimedia Commons"})); }catch(e){}
  }
}

async function fetchSummaryImage(lang, title){
  if(!title) return "";
  const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(String(title).replaceAll(" ","_"))}`;
  const res = await fetch(url);
  if(!res.ok) return "";
  const json = await res.json();
  return json?.originalimage?.source || json?.thumbnail?.source || "";
}

async function fetchSearchTitle(lang, query){
  if(!query) return "";
  const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
  const res = await fetch(url);
  if(!res.ok) return "";
  const json = await res.json();
  return json?.query?.search?.[0]?.title || "";
}

async function wikidataImage(author){
  const q = String(author||"").trim();
  if(!q) return "";
  try{
    const search = "https://www.wikidata.org/w/api.php?action=wbsearchentities&search="+encodeURIComponent(q)+"&language=fr&uselang=fr&format=json&origin=*&limit=5";
    const sr = await fetch(search);
    if(!sr.ok) return "";
    const sj = await sr.json();
    for(const r of (sj.search||[])){
      const id = r.id;
      const er = await fetch("https://www.wikidata.org/w/api.php?action=wbgetentities&ids="+encodeURIComponent(id)+"&props=claims|labels|descriptions&languages=fr&format=json&origin=*");
      if(!er.ok) continue;
      const ej = await er.json();
      const ent = ej.entities && ej.entities[id];
      const claims = ent && ent.claims || {};
      const p18 = claims.P18 && claims.P18[0] && claims.P18[0].mainsnak && claims.P18[0].mainsnak.datavalue && claims.P18[0].mainsnak.datavalue.value;
      if(!p18) continue;
      const desc = ((ent.descriptions||{}).fr||{}).value||"";
      const inst = (claims.P31||[]).map(x=>x.mainsnak?.datavalue?.value?.id||"");
      const occ = (claims.P106||[]).map(x=>x.mainsnak?.datavalue?.value?.id||"");
      const musical = /musicien|chanteur|chanteuse|groupe|artiste|musical/i.test(desc) || inst.some(x=>["Q215380","Q5741069","Q1053574","Q2088357"].includes(x)) || occ.length>0;
      if(!musical) continue;
      return "https://commons.wikimedia.org/wiki/Special:Redirect/file/"+encodeURIComponent(p18.replace(/ /g,"_"));
    }
  }catch(e){}
  return "";
}

const ARTIST_IMAGE_PENDING = new Map();

async function findArtistImage(d, langDefault){
  const author = cleanArtistName(d.Auteur);
  const title = cleanArtistName(d.Titre);
  if(!author && !title) return null;

  if(d.Photo && /^https?:\/\//i.test(String(d.Photo).trim())){
    const explicit = String(d.Photo).trim();
    writeStudentPhoto(author, explicit);
    return explicit;
  }

  const fromStudent = readStudentPhoto(author);
  if(fromStudent) return fromStudent;

  const jobKey = artistKeys(author)[0] || normalizeKey(title);
  if(ARTIST_IMAGE_PENDING.has(jobKey)) return ARTIST_IMAGE_PENDING.get(jobKey);

  const job = (async()=>{
    const queries = [
      author ? `${author} chanteur` : title,
      author ? `${author} musicien` : title,
      author ? `${author} groupe musical` : title
    ].filter(Boolean);
    try{
      const searchResults = await Promise.all(queries.map(q => fetchSearchTitle("fr", q).catch(()=>"")));
      for(const foundTitle of searchResults){
        if(!foundTitle) continue;
        const img = await fetchSummaryImage("fr", foundTitle).catch(()=>"");
        if(img){ writeStudentPhoto(author, img); return img; }
      }
      const foundEn = await fetchSearchTitle("en", author ? `${author} musician` : title).catch(()=>"");
      if(foundEn){
        const img = await fetchSummaryImage("en", foundEn).catch(()=>"");
        if(img){ writeStudentPhoto(author, img); return img; }
      }
      const wiki = await wikidataImage(author).catch(()=>"");
      if(wiki){ writeStudentPhoto(author, wiki); return wiki; }
    }catch(e){}
    return null;
  })();

  ARTIST_IMAGE_PENDING.set(jobKey, job);
  try{
    return await job;
  }finally{
    ARTIST_IMAGE_PENDING.delete(jobKey);
  }
}

function normalizeYouTube(link){
  if(!link) return ''; let s=(''+link).trim();
  if(/^[A-Za-z0-9_\-]{11}$/.test(s)) s='https://www.youtube.com/watch?v='+s;
  else if(!/^https?:\/\//i.test(s)) s='https://' + s;
  return s;
}

function normalizeCreationYear(value){
  if(value==null || value==="") return "";
  if(typeof value==="number" && isFinite(value)) return String(Math.trunc(value));
  const m=String(value).match(/\b(1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\b/);
  return m ? m[1] : String(value).trim();
}
function displayWorkTitle(d){
  const title=String(d.Titre||"").trim();
  const year=normalizeCreationYear(d.Annee);
  if(!title) return "";
  if(!year) return title;
  const clean=title.replace(/\s*\((1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\)\s*$/,"").trim();
  return `${clean} (${year})`;
}

function makeCard(d){
  const c=document.createElement('div'); c.className='card';
  const dateTxt = formatJJMMAAAA(d.Date);
  const flag = flagForOrigin(d.Origine);
  c.innerHTML=`
    <div class="meta">
      <div class="title">${displayWorkTitle(d)}</div>
      <div class="row"><div class="lab">Auteur</div><div class="val">${d.Auteur||''}</div></div>
      <div class="row"><div class="lab">Origine</div><div class="val"><span class="flag">${flag||''}</span>${d.Origine||''}</div></div>
      <div class="row"><div class="lab">Date d’écoute</div><div class="val">${dateTxt||'—'}</div></div>
    </div>
    <div class="photo"><div class="badge" style="color:#64748b">Recherche photo…</div></div>
    <div class="qr"><div class="cap">QR YouTube</div><div class="qrbox"><div class="qrdiv"></div></div><div class="qrFallback"></div></div>
    <div class="avis"><span class="hint">Avis :</span></div>
  `;
  return c;
}

async function fillCard(card, d, langDefault){
  // Photo : URL fournie > Wikipedia
  const photo=card.querySelector('.photo');
  try{
    const url = await findArtistImage(d, langDefault);
    if(url){ photo.innerHTML=`<img src="${url}" alt="Photo">`; }
    else{ photo.innerHTML=`<div class="badge" style="color:#64748b">Aucune photo trouvée</div>`; }
  }catch{ photo.innerHTML=`<div class="badge" style="color:#64748b">Aucune photo trouvée</div>`; }

  // QR via QRCode.js
  const fb=card.querySelector('.qrFallback'); const qrdiv=card.querySelector('.qrdiv');
  qrdiv.innerHTML='';
  const link=normalizeYouTube(d.YouTube||'');
  if(!link){ fb.textContent='Pas de lien'; return; }
  try{
    new QRCode(qrdiv,{text:link,width:60,height:60,correctLevel:QRCode.CorrectLevel.M});
    fb.innerHTML = `<a href="${link}" target="_blank" style="font-size:10px;word-break:break-all">Ouvrir la vidéo</a>`;
  }catch(e){
    fb.textContent='QR indisponible';
  }
}

document.getElementById('btnMake').addEventListener('click', async ()=>{
  try{
    const f = document.getElementById('file').files[0]; if(!f){ say('Choisis un fichier'); return; }
    say(`Lecture : ${f.name}…`);
    const buf = await f.arrayBuffer(); let rows=[];
    if(f.name.toLowerCase().endsWith('.csv')){
      const text=new TextDecoder().decode(new Uint8Array(buf)); const lines=text.split(/\r?\n/).filter(x=>x.trim()); const headers=lines.shift().split(/;|,|\t/).map(s=>s.trim());
      for(const line of lines){ const parts=line.split(/;|,|\t/); const obj={}; headers.forEach((h,i)=>obj[h]=parts[i]||''); rows.push(obj); }
    }else{
      const wb=XLSX.read(buf,{type:'array', cellFormula:false, cellHTML:false, cellStyles:false}); if(!wb.SheetNames?.length){ say('Aucune feuille'); return; } const ws=wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    }
    if(!rows.length){ say('Aucune donnée'); return; }
    say(`${rows.length} ligne(s) lue(s). Génération des fiches depuis musique.xlsx…`, true);
    const mapped = rows.map(ensureKeys); const groups = chunk(mapped,4);
    pagesEl.innerHTML='';

    // Affichage immédiat des fiches : le rendu ne dépend plus des recherches réseau.
    const jobs = [];
    const langDefault = document.getElementById('lang').value||'fr';

    for(const g of groups){
      const page=document.createElement('section'); page.className='page';
      for(const r of g){
        const card=makeCard(r);
        page.appendChild(card);
        jobs.push(fillCard(card, r, langDefault));
      }
      pagesEl.appendChild(page);
    }

    say(`⚡ ${mapped.length} fiches affichées — chargement des photos et QR en arrière-plan…`, true);

    // Toutes les recherches indépendantes partent en parallèle.
    await Promise.allSettled(jobs);

    say(`✅ Fiches générées : ${mapped.length}`, true);
  }catch(e){ console.error(e); say('Erreur : '+e.message); alert('Erreur : '+e.message); }
});

/* Export PDF sans pages blanches, jsPDF + html2canvas */
document.getElementById('btnPDF').addEventListener('click', async ()=>{
  const pages = Array.from(document.querySelectorAll('.page'));
  if(!pages.length){ alert('Génère les fiches avant.'); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  for(let i=0;i<pages.length;i++){
    const canvas = await html2canvas(pages[i], { scale: 2, useCORS: true, letterRendering: true, windowWidth: 2100 });
    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    if(i < pages.length-1) pdf.addPage('a4','portrait');
  }
  pdf.save('fiches_artistes.pdf');
});
</script>

<!-- === AUTOLOAD (même répertoire) : charge automatiquement 'musique.xlsx' situé dans le même dossier que cette page === -->
<script>
(function(){
  const RELATIVE_PATH = "musique.xlsx"; // même répertoire que la page HTML
  function ready(fn){ if(document.readyState!=="loading") fn(); else document.addEventListener("DOMContentLoaded", fn); }

  ready(async function(){
    try{
      const absURL = new URL(RELATIVE_PATH, document.baseURI).href;
      const fileInput = document.querySelector('#file') || document.querySelector('input[type="file"]');
      const genBtn = document.getElementById('btnMake') || Array.from(document.querySelectorAll('button')).find(b=>/gen[eé]r/i.test(b.textContent||""));
      if(!fileInput || !genBtn){
        const st = document.getElementById('status') || document.body;
        const p = document.createElement('div'); p.style.color='#b45309'; p.style.margin='8px 0';
        p.textContent = "⚠ Auto-chargement : champ fichier ou bouton Générer introuvable.";
        st.appendChild(p);
        return;
      }
      let buf;
      try{
        const resp = await fetch(absURL, {cache:'default'});
        if(!resp.ok) throw new Error('HTTP '+resp.status);
        buf = await resp.arrayBuffer();
      }catch(e){
        const st = document.getElementById('status') || document.body;
        const p = document.createElement('div'); p.style.color='#b45309'; p.style.margin='8px 0';
        p.textContent = (location.protocol === 'file:')
          ? "⚠ Le navigateur bloque le chargement automatique en file://. Servez le dossier via un petit serveur local (ex. python -m http.server) puis rechargez la page."
          : ("⚠ Impossible de charger 'musique.xlsx' ("+e.message+").");
        st.appendChild(p);
        return;
      }
      const file = new File([buf], "musique.xlsx", {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const dt = new DataTransfer(); dt.items.add(file); fileInput.files = dt.files;
      genBtn.click();
    }catch(err){
      const st = document.getElementById('status') || document.body;
      const p = document.createElement('div'); p.style.color='#b91c1c'; p.style.margin='8px 0';
      p.textContent = "⚠ Auto-chargement : " + err.message;
      st.appendChild(p);
      console.error(err);
    }
  });
})();
</script>
